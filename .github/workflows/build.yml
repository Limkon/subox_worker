name: Build Worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@main   # ⬅️ 升级到 v6 (原生支持 Node 24，无警告)

      - name: Setup Node.js
        uses: actions/setup-node@main # ⬅️ 升级到 v5 (原生支持 Node 24，无警告)
        with:
          node-version: 'x'

      - name: Install dependencies
        run: npm install

      - name: Build worker
        run: npm run build

      - name: Zip output
        # esbuild 已经直接将文件输出到了 result/_worker.js，这里不再需要 mv 命令，直接打包即可
        run: |
          cd result
          zip _worker.zip _worker.js

    # - name: Upload worker artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: worker-script
    #     path: result/_worker.js # 路径已更新为 result 目录
    #     retention-days: 5

      - name: Commit and push result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add result/_worker.zip
          git commit -m "build: update worker script in result/ [skip ci]" || echo "No changes to commit"
          git push
