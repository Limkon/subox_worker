name: Build Worker

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker-artifact
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 固定到不可变 commit SHA（actions/checkout v4.2.2）
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # 固定到不可变 commit SHA（actions/setup-node v4.1.0）
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (locked)
        run: npm ci

      # 构建 + 语法校验 + 43 个单元测试 + 真实 workerd 运行时测试
      - name: Verify (build / tests / workerd runtime)
        run: npm run verify

      - name: Package artifact
        run: |
          cd result
          sha256sum _worker.js > _worker.js.sha256
          rm -f _worker.zip
          zip -j _worker.zip _worker.js

      - name: Verify packaged artifact
        run: |
          cd result
          actual=$(unzip -p _worker.zip _worker.js | sha256sum | cut -d' ' -f1)
          expected=$(cut -d' ' -f1 _worker.js.sha256)
          test "$actual" = "$expected" || { echo "artifact hash mismatch"; exit 1; }

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result/_worker.zip result/_worker.js.sha256
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update worker bundle in result/ [skip ci]"
            git push
          fi
